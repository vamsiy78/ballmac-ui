name: Bug report
description: Something does not work or looks wrong
labels: [bug]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: The component, block or template, for example `@ballmac/button`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw. Add a screenshot if it is visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or a link to a reproduction.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Framework and version, Tailwind version, browser
