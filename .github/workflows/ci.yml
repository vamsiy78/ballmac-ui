# Checks every push and pull request. The Pro source is never checked out here: this repository's logs are public, so everything that
# needs the Pro source runs in a private workflow in the Pro repository ("Pro CI"). This job still guards against Pro ever being
# committed to this repository (verify:pro looks at git history).
name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:registry
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: No Pro source in git history
        run: pnpm verify:pro
      - name: Build site
        run: pnpm --filter @ballmac-ui/www exec next build
