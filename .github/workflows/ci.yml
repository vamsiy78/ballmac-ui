# Checks every push and pull request. The Pro source is never checked out here: this repository's logs are public, so everything that
# needs the Pro source runs in a private workflow in the Pro repository ("Pro CI"). This job still guards against Pro ever being
# committed to this repository (verify:pro looks at git history).
name: CI

on:
  push:
    branches: [main, preprod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:registry
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: No Pro source in git history
        run: pnpm verify:pro
      - name: Build site (the static Cloudflare build, free items only)
        run: pnpm --filter @ballmac-ui/www cf:build
      - name: Bundle the Worker (no upload)
        run: pnpm --filter @ballmac-ui/www exec wrangler deploy --dry-run --outdir .wrangler/dry-run

  # After the checks pass on main or preprod, starts the Cloudflare deploy in the private Pro repository (its "Deploy" workflow), for this exact commit.
  # main deploys ui.ballmac.com; preprod deploys the preview. Off until the repository variable CF_DEPLOY is "on". Setup: internal/CLOUDFLARE.md in the Pro repository.
  deploy:
    needs: check
    if: github.event_name == 'push' && vars.CF_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the deploy
        run: |
          gh workflow run deploy.yml -R vamsiy78/ballmac-ui-pro --ref "$BRANCH" \
            -f target="$TARGET" -f ui_ref="$GITHUB_SHA" -f pro_ref="$BRANCH" -f reason="ballmac-ui ${GITHUB_SHA::7}"
          echo "Started the $TARGET deploy of ${GITHUB_SHA::7}: https://github.com/vamsiy78/ballmac-ui-pro/actions/workflows/deploy.yml" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.PRO_DEPLOY_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
