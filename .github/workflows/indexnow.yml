# Tells Bing and other IndexNow search engines about changed pages. The production deploy (Deploy, in the private Pro repository) runs
# `pnpm indexnow` after every deploy; run this by hand from the Actions tab, with "all" ticked, to send every URL in the sitemap.
name: IndexNow

on:
  workflow_dispatch:
    inputs:
      all:
        description: Send every URL in the sitemap, not only recent changes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm indexnow ${{ inputs.all && '--all' || '' }}
