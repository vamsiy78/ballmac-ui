# Publishes @ballmac/mcp to npm.
# Trigger: push a tag named mcp-v<version> (for example mcp-v1.0.0) that matches packages/mcp/package.json,
# or run it by hand from the Actions tab. Needs the NPM_TOKEN repository secret (an npm automation or
# granular token with publish rights on the @ballmac scope). Publishes with provenance.
name: Release MCP

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "mcp-v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package version $version"; exit 1; }
      - run: pnpm run build
      - run: pnpm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
