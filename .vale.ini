# Prose lint for the docs and the changelog: `vale apps/www/content` (CI runs it in .github/workflows/docs.yml). The rules are in .vale/styles/Ballmac and
# explained in docs/STYLE.md. Generated reference pages (they carry generatedFrom in their frontmatter) are written by code, so they are not linted.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Ballmac

[apps/www/content/docs/{index,get-started/*,guides/*,concepts/*,reference/registry,reference/theme-tokens}.mdx]
BasedOnStyles = Ballmac

[apps/www/content/changelog/*.md]
BasedOnStyles = Ballmac
# Changelog lines name things (blocks, flags, props) and have no headings of their own.
Ballmac.HeadingCase = NO
Ballmac.HeadingForm = NO
Ballmac.Sentences = NO
